name: fetch-board

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone PerkRadar upstream
        run: git clone --depth 1 https://github.com/luobinger/PerkRadar.git perkradar
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and run
        run: |
          cp run-once.mts perkradar/run-once.mts
          cd perkradar
          npm install --no-audit --no-fund
          node --import tsx run-once.mts
      - name: Publish board via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          path = "reports/board-full.json"
          data = open("perkradar/reports/board-full.json", "rb").read()
          api = "https://api.github.com/repos/" + repo + "/contents/" + path
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}
          sha = None
          try:
              req = urllib.request.Request(api, headers=headers)
              with urllib.request.urlopen(req) as r:
                  sha = json.load(r).get("sha")
          except Exception as e:
              print("no existing file:", e)
          body = {"message": "board update", "content": base64.b64encode(data).decode()}
          if sha:
              body["sha"] = sha
          req = urllib.request.Request(api, data=json.dumps(body).encode(), method="PUT", headers={**headers, "Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              print("published:", r.status)
          PYEOF
